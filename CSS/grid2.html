<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .dashboard {
            display: grid;
            grid-template-columns: 250px 1fr;
            height: 100vh;
        }

        aside {
            background-color: black;
            color: white;
            padding: 10px;

        }

        main {
            padding: 20px;
        }

        @media(max-width:500px) {
            .dashboard {
                grid-template-columns: 1fr;
            }

            aside {
                text-align: center;
            }
        }
    </style>
</head>

<body>
    <div class="dashboard">
        <aside>
            sidebar
        </aside>

        <main>
            main
        </main>

    </div>
</body>

</html>

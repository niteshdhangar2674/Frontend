<!DOCTYPE html>
<html lang="en">

<head>
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        nav {
            background-color: black;
            color: white;
            display: flex;
            justify-content: space-between;
            padding: 20px;
            align-items: center;
        }

        ul {
            display: flex;
            gap: 20px;
        }

        @media(max-width:500px) {
            nav {
                flex-direction: column;
                gap: 20px;
            }

            ul {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>

<body>
    <nav>
        <h2>Shopkard</h2>

        <ul>
            <ul>Home</ul>
            <ul>Product</ul>
            <ul>Services</ul>
            <ul>Contacts</ul>
        </ul>
    </nav>
</body>

</html>

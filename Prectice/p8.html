<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .video {
            width: 100px;
            height: 100px;
            position: relative;
            border: 2px solid black;
            border-radius: 50%;
            text-align: center;
            background-color: rgb(80, 80, 81);

        }

        .popup {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background-color: green;
            width: 20px;
            height: 20px;
            border-radius: 50%;

        }
    </style>
</head>

<body>


    <div class="video">
        <div class="popup"></div>
    </div>



</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=], initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            position: relative;
        }

        .box {
            position: absolute;
            width: 100px;
            height: 100px;
        }

        .red {
            top: 50px;
            left: 50px;
            z-index: 1;
            background-color: rgb(13, 74, 74);
            border: 1px solid white;
            border-radius: 10px;

        }

        .blue {
            top: 80px;
            left: 80px;
            z-index: 2;
            background-color: rgb(13, 74, 74);
            border: 1px solid white;
            border-radius: 10px;

        }

        .green {
            top: 110px;
            left: 110px;
            z-index: 3;
            background-color: rgb(13, 74, 74);
            border: 1px solid white;
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box red"></div>
        <div class="box blue"></div>
        <div class="box green"></div>
    </div>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .box {
            width: 100px;
            height: 100px;
            border: 1px solid black;
            position: relative;
            border-radius: 20%;
            background-color: rgb(3, 62, 3);
        }

        .count {
            position: absolute;
            top: -5px;
            right: -5px;
            background-color: rgb(29, 163, 168);
            height: 20px;
            width: 20px;
            border-radius: 50%;
            text-align: center;
            color: white;
        }
    </style>
</head>

<body>
    <div class="box">
        <d class="count">1
    </div>
    </div>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h2>order List </h2>

    <ol>
        <li>milk</li>
        <li>bread</li>
        <li>butter</li>
        <li>cheese</li>
    </ol>
    <h2>type A</h2>
    <ol type="A">
        <li>milk</li>
        <li>bread</li>
        <li>butter</li>
        <li>cheese</li>
    </ol>
    <h2>type a</h2>
    <ol type="a">
        <li>milk</li>
        <li>bread</li>
        <li>butter</li>
        <li>cheese</li>
    </ol>
    <h2>type roman number</h2>
    <ol type="I">
        <li>milk</li>
        <li>bread</li>
        <li>butter</li>
        <li>cheese</li>
    </ol>
    <h2>type roman number</h2>
    <ol type="i">
        <li>milk</li>
        <li>bread</li>
        <li>butter</li>
        <li>cheese</li>
    </ol>
</body>

</html>
